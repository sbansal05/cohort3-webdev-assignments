<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Manager</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <link rel="stylesheet" href="styles.css">

</head>
<body>

  <div class="container app-container">
    <h1 class="mb-4">Bookmark Manager</h1>

    <div class="input-container mb-4">
      <div class="bookmark-inputs d-flex flex-column flex-md-row gap-2">
        <input type="text" id="bookmark-url" class="form-control" placeholder="Enter bookmark URL">
        <input type="text" id="bookmark-category" class="form-control" placeholder="Enter category">
      </div>
      <button id="add-bookmark-btn" class="btn btn-primary w-100 mt-2">Add Bookmark</button>
    </div>

    <ul id="bookmark-list" class="list-group">
      </ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0rsoIHHIsGbq2F6s" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
